<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>내 영화 티어리스트</title>
<style>
:root{color-scheme:dark;--bg:#0d111b;--panel:#171d2b;--line:#30394b;--muted:#9da9bd;--text:#f5f6fa;--white:#fff}*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#25314b 0%,transparent 60%),var(--bg);color:var(--text);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1110px;margin:auto;padding:52px 24px 65px}.eyebrow{color:#b6a2fa;font-size:12px;font-weight:800;letter-spacing:.19em}.headline{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:9px 0 28px}.headline h1{font-size:clamp(30px,5vw,47px);letter-spacing:-.055em;line-height:1.2;margin:0}.intro{font-size:14px;color:var(--muted);margin:12px 0 0}.top-actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #485166;border-radius:11px;padding:12px 15px;background:#222b3c;color:#f7f8fe;font-size:13px;font-weight:700;transition:background .2s,transform .2s}.btn:hover{background:#323d52}.btn:active{transform:scale(.98)}.btn.primary{border-color:#8979df;background:#806be3}.btn.primary:hover{background:#9481ee}.board{background:#141b29;border:1px solid #394153;border-radius:19px;padding:12px;box-shadow:0 16px 46px #0003}.tier-row{--tier:#fff;display:grid;grid-template-columns:103px minmax(0,1fr);min-height:114px;border-radius:10px;margin-bottom:8px;overflow:hidden;background:#212937;border:1px solid #354054}.tier-row:last-child{margin-bottom:0}.tier-label{display:grid;place-items:center;background:var(--tier);color:#171a21;font-weight:950;font-size:45px;letter-spacing:-.06em;user-select:none}.tier-content{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:9px;min-height:112px;padding:14px;transition:background .13s}.tier-row.is-target .tier-content{background:#39475a}.tier-row.is-target{outline:2px solid #b9adff;outline-offset:-2px}.movie{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:68px;max-width:none;padding:11px 29px 11px 12px;border:1px solid #526078;border-radius:12px;background:#303a4e;box-shadow:0 4px 12px #0002;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}.movie:hover{border-color:#9cabe1;background:#3b4760}.movie:active{cursor:grabbing}.movie .emoji{font-size:27px;line-height:1.2;flex:none}.movie .movie-title{font-size:13px;line-height:1.5;font-weight:750;white-space:nowrap;overflow-wrap:normal}.movie .delete{position:absolute;right:5px;top:5px;width:23px;height:23px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:#b2bfd1;font-size:18px;cursor:pointer;touch-action:manipulation}.movie .delete:hover,.movie .delete:focus-visible{background:#a03b4b;color:#fff}.movie.drag-source{opacity:.24}.ghost{position:fixed!important;left:0;top:0;z-index:1000;width:max-content;max-width:210px;pointer-events:none;opacity:.96;transform:rotate(-3deg);box-shadow:0 16px 36px #0009;cursor:grabbing}.insert-marker{height:62px;width:5px;flex:0 0 5px;background:#c1a8ff;border-radius:99px;pointer-events:none;box-shadow:0 0 0 3px #c1a8ff33}.empty-hint{color:#6f8096;font-size:13px;pointer-events:none}.waiting{margin-top:15px}.waiting .tier-label{background:#2b3445;color:#a9b6c9;font-size:25px}.waiting .tier-content{min-height:118px}.waiting .tier-row{border-style:dashed}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 11px}.section-head h2{font-size:17px;margin:0;letter-spacing:-.035em}.section-head p{font-size:12px;color:var(--muted);margin:0}.add-panel{margin-top:27px;border:1px solid #354054;border-radius:17px;background:#171e2d;padding:21px 24px}.add-panel h2{font-size:18px;margin:0 0 15px}.add-form{display:flex;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}.field.small{flex:0 0 104px}.field label{font-size:12px;color:#afbad0;font-weight:650}.field input{min-width:0;width:100%;height:44px;padding:0 12px;border:1px solid #46536a;border-radius:10px;background:#252e40;color:#fff;outline:none}.field input:focus{border-color:#a497ef;box-shadow:0 0 0 3px #a497ef22}.add-form .btn{height:44px;white-space:nowrap}.footer{color:#77869b;text-align:center;font-size:12px;margin:23px 0}.toast{position:fixed;bottom:23px;left:50%;transform:translate(-50%,10px);opacity:0;background:#f4f0ff;color:#22243a;padding:10px 17px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 9px 30px #0006;transition:opacity .2s,transform .2s;pointer-events:none;z-index:1100}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:730px){.shell{padding:29px 12px 42px}.headline{display:block}.top-actions{margin-top:21px}.top-actions .btn{flex:1}.board{padding:7px;border-radius:13px}.tier-row{grid-template-columns:58px minmax(0,1fr);min-height:100px;margin-bottom:6px}.tier-label{font-size:34px}.tier-content{min-height:98px;padding:9px;gap:7px}.movie{min-height:56px;gap:7px;padding:8px 25px 8px 9px;max-width:none}.movie .emoji{font-size:23px}.movie .movie-title{font-size:12px}.waiting .tier-label{font-size:19px}.add-panel{padding:16px}.add-form{flex-wrap:wrap}.add-form .field{flex:1 1 calc(70% - 10px)}.add-form .field.small{flex:1 1 25%}.add-form .btn{width:100%}.section-head p{font-size:11px}.intro{line-height:1.6}}
</style>
</head>
<body>
<main class="shell">
  <div class="eyebrow">MOVIE RANKING STUDIO</div>
  <header class="headline"><div><h1>🎞️ 내 영화 티어리스트</h1><p class="intro">영화 카드를 원하는 등급으로 끌어다 놓으세요. 같은 칸에서도 순서를 바꿀 수 있어요.</p></div><div class="top-actions"><button class="btn" id="resetBtn" type="button">↺ 처음으로 되돌리기</button><button class="btn primary" id="saveBtn" type="button">↓ 결과 이미지 저장</button></div></header>
  <section class="board" id="board" aria-label="영화 티어리스트"></section>
  <section class="waiting"><div class="section-head"><h2>아직 분류하지 않은 영화</h2><p>아래 카드도 끌어다 이동할 수 있어요</p></div><div id="waitingBoard"></div></section>
  <section class="add-panel"><h2>＋ 영화 추가</h2><form class="add-form" id="addForm"><div class="field"><label for="titleInput">영화 제목</label><input id="titleInput" placeholder="영화 제목을 입력하세요" maxlength="90" required autocomplete="off"></div><div class="field small"><label for="emojiInput">이모지 (선택)</label><input id="emojiInput" placeholder="🎬" maxlength="12" autocomplete="off"></div><button type="submit" class="btn primary">영화 추가하기</button></form></section>
  <p class="footer">자동 저장됨 · 영화 카드는 드래그로만 이동할 수 있어요 · 결과 이미지에는 S~D만 포함돼요</p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const STORE='my-movie-tier-list-v1';
const LEVELS=[{id:'S',color:'#ff686a'},{id:'A',color:'#ffad58'},{id:'B',color:'#ffe17a'},{id:'C',color:'#7bd89e'},{id:'D',color:'#7caefd'}];
const INITIAL=[['🏠','기생충'],['🚀','인터스텔라'],['🎹','라라랜드'],['🐉','센과 치히로의 행방불명'],['🛡️','어벤져스: 엔드게임'],['👊','범죄도시'],['🚢','타이타닉'],['🤠','토이 스토리']].map((x,i)=>({id:'default-'+i,emoji:x[0],title:x[1]}));
const emptyBuckets=()=>Object.fromEntries([...LEVELS.map(x=>x.id),'waiting'].map(x=>[x,[]]));
function fresh(){return{movies:INITIAL.map(x=>({...x})),buckets:{...emptyBuckets(),waiting:INITIAL.map(x=>x.id)}}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE));if(!v||!Array.isArray(v.movies)||!v.buckets)return fresh();const seen=new Set();const cleanMovies=v.movies.filter(m=>m&&typeof m.id==='string'&&typeof m.title==='string'&&typeof m.emoji==='string'&&!seen.has(m.id)&&seen.add(m.id));const validIds=new Set(cleanMovies.map(m=>m.id));const buckets=emptyBuckets();const assigned=new Set();for(const k of Object.keys(buckets))for(const id of Array.isArray(v.buckets[k])?v.buckets[k]:[])if(validIds.has(id)&&!assigned.has(id)){buckets[k].push(id);assigned.add(id)}for(const m of cleanMovies)if(!assigned.has(m.id))buckets.waiting.push(m.id);return{movies:cleanMovies,buckets}}catch{return fresh()}}
let state=load(),drag=null,toastTimer=null;
const board=document.getElementById('board'),waitingBoard=document.getElementById('waitingBoard');
const byId=id=>state.movies.find(m=>m.id===id);
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{notify('저장 공간을 사용할 수 없어 자동 저장되지 않았어요.')}}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function createRow(key,color){const row=document.createElement('div');row.className='tier-row';row.dataset.bucket=key;row.style.setProperty('--tier',color);const label=document.createElement('div');label.className='tier-label';label.textContent=key==='waiting'?'·':key;if(key==='waiting')label.setAttribute('aria-label','대기 칸');const content=document.createElement('div');content.className='tier-content';content.dataset.content=key;for(const id of state.buckets[key]){const movie=byId(id);if(!movie)continue;const card=document.createElement('div');card.className='movie';card.dataset.id=id;card.setAttribute('role','group');card.setAttribute('aria-label',movie.title+' 영화 카드');const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=movie.emoji;const title=document.createElement('span');title.className='movie-title';title.textContent=movie.title;const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='×';del.title=movie.title+' 삭제';del.setAttribute('aria-label',movie.title+' 삭제');del.addEventListener('click',e=>{e.stopPropagation();removeMovie(id)});card.append(emoji,title,del);card.addEventListener('pointerdown',startDrag);content.appendChild(card)}if(!state.buckets[key].length){const hint=document.createElement('span');hint.className='empty-hint';hint.textContent='여기에 영화를 놓아주세요';content.appendChild(hint)}row.append(label,content);return row}
function render(){board.replaceChildren(...LEVELS.map(({id,color})=>createRow(id,color)));waitingBoard.replaceChildren(createRow('waiting','#303a4b'))}
function removeMovie(id){if(!confirm('정말 할까요?'))return;state.movies=state.movies.filter(m=>m.id!==id);for(const key in state.buckets)state.buckets[key]=state.buckets[key].filter(x=>x!==id);persist();render();notify('영화를 삭제했어요.')}
document.getElementById('resetBtn').addEventListener('click',()=>{if(!confirm('정말 할까요?'))return;const order=[...LEVELS.map(x=>x.id),'waiting'].flatMap(k=>state.buckets[k]);state.buckets=emptyBuckets();state.buckets.waiting=order;persist();render();notify('모든 영화를 대기 칸으로 옮겼어요.')});
document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('titleInput').value.trim();const emoji=document.getElementById('emojiInput').value.trim()||'🎬';if(!title)return;const id='custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);state.movies.push({id,title,emoji});state.buckets.waiting.push(id);persist();render();e.target.reset();document.getElementById('titleInput').focus();notify('영화를 추가했어요.')});
function startDrag(e){if(e.button!==0||e.target.closest('.delete')||drag)return;const source=e.currentTarget;const id=source.dataset.id;const row=source.closest('[data-bucket]');drag={id,from:row.dataset.bucket,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,source,ghost:null,marker:null,target:null,index:0,moved:false};source.setPointerCapture(e.pointerId);source.addEventListener('pointermove',moveDrag);source.addEventListener('pointerup',endDrag);source.addEventListener('pointercancel',cancelDrag);e.preventDefault()}
function lift(e){const src=drag.source,rect=src.getBoundingClientRect();const ghost=src.cloneNode(true);ghost.classList.add('ghost');ghost.querySelector('.delete')?.remove();ghost.style.width=Math.min(rect.width,210)+'px';ghost.style.left=(e.clientX-rect.width/2)+'px';ghost.style.top=(e.clientY-rect.height/2)+'px';document.body.appendChild(ghost);drag.ghost=ghost;src.classList.add('drag-source');drag.marker=document.createElement('div');drag.marker.className='insert-marker';drag.moved=true}
function moveDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;const d=drag;if(!d.moved){if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<5)return;lift(e)}const rect=d.ghost.getBoundingClientRect();d.ghost.style.left=e.clientX-rect.width/2+'px';d.ghost.style.top=e.clientY-rect.height/2+'px';const hit=document.elementFromPoint(e.clientX,e.clientY);const row=hit?.closest('[data-bucket]');document.querySelectorAll('.tier-row.is-target').forEach(el=>el.classList.remove('is-target'));d.marker.remove();d.target=null;if(!row)return;const content=row.querySelector('.tier-content');row.classList.add('is-target');const cards=[...content.querySelectorAll('.movie:not(.drag-source)')];let index=cards.length;for(let i=0;i<cards.length;i++){const r=cards[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2||(e.clientY<=r.bottom&&e.clientX<r.left+r.width/2)){index=i;break}}if(cards[index])content.insertBefore(d.marker,cards[index]);else content.appendChild(d.marker);d.target=row.dataset.bucket;d.index=index}
function cleanup(){if(!drag)return;drag.source.removeEventListener('pointermove',moveDrag);drag.source.removeEventListener('pointerup',endDrag);drag.source.removeEventListener('pointercancel',cancelDrag);drag.source.classList.remove('drag-source');drag.ghost?.remove();drag.marker?.remove();document.querySelectorAll('.tier-row.is-target').forEach(x=>x.classList.remove('is-target'));drag=null}
function endDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;const {id,target,index,moved}=drag;cleanup();if(!moved||!target)return;for(const key in state.buckets)state.buckets[key]=state.buckets[key].filter(x=>x!==id);state.buckets[target].splice(Math.min(index,state.buckets[target].length),0,id);persist();render()}
function cancelDrag(){cleanup()}
// Canvas로 직접 그리므로 외부 라이브러리나 네트워크 연결 없이 PNG 저장 가능.
function rounded(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function exportImage(){
  const W=1160,margin=44,gap=14,labelW=112,padding=16,contentW=W-margin*2-labelW;
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  if(!ctx){notify('이미지를 생성하지 못했어요.');return}
  const titleFont='700 21px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  const emojiFont='27px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const cardPad=12,emojiSlot=42;
  const availableCardWidth=contentW-padding*2;
  ctx.font=titleFont;
  const rows=LEVELS.map(({id,color})=>{
    const cards=state.buckets[id].map(byId).filter(Boolean);
    let x=0,y=0,lineHeight=0;
    const placements=[];
    for(const m of cards){
      // Reserve a dedicated emoji column, separate from the title column.
      const titleWidth=ctx.measureText(m.title).width;
      // Keep the complete title on one line; move the whole card to the next row if needed.
      const w=Math.min(availableCardWidth,Math.max(130,Math.ceil(cardPad*2+emojiSlot+titleWidth)));
      const h=68;
      if(x&&x+w>availableCardWidth){x=0;y+=lineHeight+11;lineHeight=0}
      placements.push({m,x,y,w,h});
      x+=w+11;
      lineHeight=Math.max(lineHeight,h);
    }
    const height=Math.max(116,y+lineHeight+padding*2);
    return{id,color,placements,height};
  });
  const header=125;
  const H=header+rows.reduce((sum,row)=>sum+row.height+gap,0)+margin-gap;
  const scale=2;
  canvas.width=W*scale;canvas.height=H*scale;ctx.scale(scale,scale);
  ctx.fillStyle='#111723';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#b5a0fa';ctx.font='800 17px system-ui,sans-serif';
  ctx.fillText('MY MOVIE TIER LIST',margin,47);
  ctx.fillStyle='#fff';ctx.font='800 37px "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
  ctx.fillText('내 영화 티어리스트',margin,99);
  let yy=header;
  for(const row of rows){
    rounded(ctx,margin,yy,W-margin*2,row.height,12);
    ctx.fillStyle='#242d3e';ctx.fill();
    ctx.save();rounded(ctx,margin,yy,W-margin*2,row.height,12);ctx.clip();
    ctx.fillStyle=row.color;ctx.fillRect(margin,yy,labelW,row.height);ctx.restore();
    ctx.fillStyle='#19202b';ctx.font='900 53px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(row.id,margin+labelW/2,yy+row.height/2);
    ctx.textAlign='left';
    for(const p of row.placements){
      const px=margin+labelW+padding+p.x,py=yy+padding+p.y;
      rounded(ctx,px,py,p.w,p.h,10);
      ctx.fillStyle='#3c485f';ctx.fill();
      ctx.strokeStyle='#66738d';ctx.lineWidth=1;ctx.stroke();
      // Emoji and text now have distinct horizontal positions on every tier.
      ctx.font=emojiFont;ctx.textBaseline='middle';
      ctx.fillText(p.m.emoji,px+cardPad,py+p.h/2);
      ctx.fillStyle='#f8faff';ctx.font=titleFont;ctx.textBaseline='middle';
      const textX=px+cardPad+emojiSlot;
      // The optional maxWidth compresses unusually long titles instead of wrapping them.
      ctx.fillText(p.m.title,textX,py+p.h/2,p.w-cardPad*2-emojiSlot);
    }
    yy+=row.height+gap;
  }
  canvas.toBlob(blob=>{
    if(!blob){notify('이미지 저장에 실패했어요.');return}
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='내 영화 티어리스트.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    notify('결과 이미지를 저장했어요.');
  },'image/png');
}
document.getElementById('saveBtn').addEventListener('click',exportImage);
render();
})();
</script>
</body>
</html>
