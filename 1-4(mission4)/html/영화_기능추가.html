<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 영화 티어리스트</title>
  <style>
    :root { --paper:#faf8f3; --ink:#242922; --muted:#5f685d; --line:#d9dad1; --green:#276453; --sage:#e3eee7; --peach:#f2e6dc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:system-ui,-apple-system,sans-serif; line-height:1.6;  }
    main { width:min(100% - 32px,860px); margin:32px auto 48px; }
    header { display:flex; align-items:start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    h1 { margin:0; font-size:clamp(26px,5vw,34px); line-height:1.25; letter-spacing:-.03em; }
    .sub { margin:10px 0 0; color:var(--muted); max-width:46ch; }
    .tools { display:flex; flex-wrap:wrap; gap:8px; width:100%; margin-top:20px; }
    .tools input { min-width:0; flex:1 1 160px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; }
    button { font:inherit; cursor:pointer; }
    .tools button { padding:10px 15px; border:1px solid var(--green); border-radius:12px; font-weight:700; background:var(--green); color:#fff; }
    .tools .reset { color:var(--green); background:#fff; }
    #message { min-height:26px; margin:14px 0; font-size:14px; color:var(--muted); }
    .tiers { display:grid; gap:10px; }
    .row { display:flex; min-height:90px; background:#fff; border:1.5px solid var(--line); border-radius:14px; overflow:hidden; }
    .row.over { outline:3px solid var(--green); outline-offset:1px; }
    .label { width:64px; flex-shrink:0; border:0; color:white; font-size:26px; font-weight:800; padding:12px 4px; }
    .S .label { background:#a55239; } .A .label { background:#b4763e; } .B .label { background:#276453; } .C .label { background:#67725d; }
    .drop { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:9px; padding:12px; min-height:88px; }
    .pool { margin-top:22px; }
    .pool-head { margin:0 0 8px; border:0; padding:0; background:transparent; color:var(--muted); font-size:17px; font-weight:700; text-align:left; }
    #pool { border:1.5px dashed var(--line); border-radius:14px; background:#fff; }

    /* 카드: 메모가 있든 없든 크기가 같도록 높이를 고정 */
    .card { width:98px; height:108px; display:flex; flex-direction:column; padding:6px; border:1px solid transparent; border-radius:10px; color:var(--ink); cursor:grab; }
    .card.selected { outline:3px solid var(--green); outline-offset:2px; }
    .pick { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; padding:2px; border:0; border-radius:7px; background:transparent; color:inherit; font-size:14px; font-weight:650; line-height:1.35; text-align:center; cursor:grab; }
    .pick .t { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden; overflow-wrap:anywhere; }
    .card button:focus-visible, .card input:focus-visible { outline-offset:0; }

    /* 메모 칸: 항상 같은 자리, 같은 높이 */
    .memo { position:relative; height:24px; margin-top:4px; flex-shrink:0; }
    .memo-add { width:100%; height:100%; padding:0; border:1px dashed rgba(36,41,34,.35); border-radius:7px; background:rgba(255,255,255,.55); color:var(--muted); font-size:12px; font-weight:650; opacity:0; transition:opacity .15s; }
    .card:hover .memo-add, .card:focus-within .memo-add { opacity:1; }
    .memo-text { display:block; height:100%; padding:0 6px; border-radius:7px; background:rgba(255,255,255,.75); font-size:12px; font-weight:500; line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:default; }
    .memo-actions { position:absolute; inset:0; display:flex; gap:3px; opacity:0; pointer-events:none; transition:opacity .15s; }
    .memo:hover .memo-actions, .memo:focus-within .memo-actions { opacity:1; pointer-events:auto; }
    .memo-actions button { flex:1; min-width:0; padding:0; border-radius:7px; font-size:12px; font-weight:700; }
    .memo-actions .edit { border:1px solid var(--green); background:var(--green); color:#fff; }
    .memo-actions .del { border:1px solid #a55239; background:#fff; color:#a55239; }
    .memo-input { width:100%; height:100%; padding:0 5px; border:1.5px solid var(--green); border-radius:7px; background:#fff; color:var(--ink); font:inherit; font-size:12px; }
    @media (hover:none) { .memo-add { opacity:.8; } }

    .count { display:block; font-size:14px; font-weight:600; }
    .note { font-size:13px; color:var(--muted); margin-top:18px; }
    :focus-visible { outline:3px solid #ba613a; outline-offset:3px; }
    @media(max-width:420px) { .label { width:48px; } .card { width:90px; } .drop { padding:10px; gap:8px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>내 영화 티어리스트</h1><p class="sub">영화를 선택한 뒤 옮길 등급 글자를 눌러 주세요. 카드를 끌어서 놓아도 됩니다.</p></div></header>
    <form class="tools" id="add-form">
      <input id="title" aria-label="영화 제목" placeholder="영화 제목 추가" maxlength="80">
      <button type="submit">추가</button>
      <button type="button" class="reset" id="reset">처음으로</button>
    </form>
    <p id="message" role="status">영화를 선택해 S·A·B·C로 나누어 보세요.</p>
    <section class="tiers" id="tiers" aria-label="영화 등급"></section>
    <section class="pool" aria-label="아직 안 정한 영화">
      <button class="pool-head" id="pool-label" type="button" aria-label="미분류로 옮기기">아직 안 정한 영화</button>
      <div class="drop" id="pool" data-tier="pool"></div>
    </section>
    <p class="note">같은 브라우저에서 이 파일을 다시 열면 정리한 목록이 남습니다. 다른 사람에게 파일을 보내도 내 입력 내역까지 전달되지는 않습니다.</p>
  </main>
  <script>
    const KEY = "codyssey-activity-04-v2";
    const LEVELS = ['S', 'A', 'B', 'C', 'pool'];
    const TITLES = ["기생충","인터스텔라","라라랜드","센과 치히로의 행방불명","어벤져스: 엔드게임","범죄도시","타이타닉","토이 스토리"];
    const COLORS = ["#f2e6dc","#e3eee7","#ede7f6","#fcefd9","#e2ecf4","#f6e3e3"];
    const MEMO_MAX = 30;
    const initial = () => ({ nextId: TITLES.length + 1, items: TITLES.map((title,index) => ({ id: 'm' + (index + 1), title, tier: 'pool' })) });
    let state = initial();
    let selected = null;
    let editing = null;
    try {
      const stored = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (stored && Number.isSafeInteger(stored.nextId) && Array.isArray(stored.items)
          && stored.items.every(item => typeof item.id === 'string' && typeof item.title === 'string' && LEVELS.includes(item.tier)
            && (item.memo === undefined || typeof item.memo === 'string'))) state = stored;
    } catch {}
    function showMessage(message) { document.querySelector('#message').textContent = message; }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch { showMessage('이 브라우저에서는 저장하지 못했어요. 현재 화면에서 확인한 내용과 다시 열어 확인한 내용을 구분해 주세요.'); }
    }
    function move(id,tier) {
      const item = state.items.find(item => item.id === id);
      if (!item || !LEVELS.includes(tier)) return;
      item.tier = tier; selected = null; editing = null; save(); render();
      showMessage((item.title || '영화') + '를 옮겼어요.');
    }
    function focusIn(id,selector) {
      const target = document.querySelector('.card[data-id="' + id + '"] ' + selector);
      if (target) target.focus();
    }
    function startMemo(id) { editing = id; render(); focusIn(id,'.memo-input'); }
    function saveMemo(id,text,refocus) {
      const item = state.items.find(item => item.id === id);
      editing = null;
      if (!item) { render(); return; }
      const memo = text.trim().slice(0,MEMO_MAX);
      const before = item.memo || '';
      if (memo) item.memo = memo; else delete item.memo;
      save(); render();
      if (refocus) focusIn(id,'.pick');
      if (memo && memo !== before) showMessage((item.title || '영화') + '에 메모를 저장했어요.');
      else if (!memo && before) showMessage((item.title || '영화') + '의 메모를 지웠어요.');
    }
    function cancelMemo(id) { editing = null; render(); focusIn(id,'.pick'); }
    function deleteMemo(id) {
      const item = state.items.find(item => item.id === id);
      if (!item) return;
      delete item.memo; editing = null; save(); render(); focusIn(id,'.pick');
      showMessage((item.title || '영화') + '의 메모를 지웠어요.');
    }
    function memoBox(item) {
      const box = document.createElement('div'); box.className = 'memo';
      const name = item.title || '영화';
      if (editing === item.id) {
        const input = document.createElement('input');
        input.className = 'memo-input'; input.maxLength = MEMO_MAX; input.value = item.memo || '';
        input.placeholder = '한 줄 메모'; input.setAttribute('aria-label',name + ' 메모 (Enter 저장, Esc 취소)');
        let done = false;
        input.addEventListener('keydown',event => {
          if (event.key === 'Enter') { event.preventDefault(); done = true; saveMemo(item.id,input.value,true); }
          else if (event.key === 'Escape') { event.preventDefault(); done = true; cancelMemo(item.id); }
        });
        input.addEventListener('blur',() => { if (!done) { done = true; saveMemo(item.id,input.value,false); } });
        box.append(input);
      } else if (item.memo) {
        const text = document.createElement('span');
        text.className = 'memo-text'; text.textContent = item.memo; text.title = item.memo;
        const actions = document.createElement('div'); actions.className = 'memo-actions';
        const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'edit';
        edit.textContent = '수정'; edit.setAttribute('aria-label',name + ' 메모 수정');
        edit.addEventListener('click',() => startMemo(item.id));
        const del = document.createElement('button'); del.type = 'button'; del.className = 'del';
        del.textContent = '삭제'; del.setAttribute('aria-label',name + ' 메모 삭제');
        del.addEventListener('click',() => deleteMemo(item.id));
        actions.append(edit,del); box.append(text,actions);
      } else {
        const add = document.createElement('button'); add.type = 'button'; add.className = 'memo-add';
        add.textContent = '+ 메모'; add.setAttribute('aria-label',name + ' 메모 달기');
        add.addEventListener('click',() => startMemo(item.id));
        box.append(add);
      }
      return box;
    }
    function card(item,index) {
      const element = document.createElement('div');
      element.className = 'card' + (selected === item.id ? ' selected' : '');
      element.draggable = editing !== item.id;
      element.dataset.id = item.id;
      element.style.backgroundColor = COLORS[index % COLORS.length];
      const pick = document.createElement('button');
      pick.type = 'button'; pick.className = 'pick'; pick.title = item.title;
      const titleText = document.createElement('span'); titleText.className = 't'; titleText.textContent = item.title || ' ';
      pick.append(titleText);
      pick.setAttribute('aria-label',(item.title || '영화 카드') + (item.memo ? ', 메모: ' + item.memo : ''));
      pick.setAttribute('aria-pressed',String(selected === item.id));
      element.append(pick,memoBox(item));
      element.addEventListener('click',event => {
        event.stopPropagation();
        if (event.target.closest('.memo')) return;
        selected = selected === item.id ? null : item.id; render();
        focusIn(item.id,'.pick');
        showMessage(selected ? (item.title || '영화') + '를 선택했어요.' : '선택을 해제했어요.');
      });
      element.addEventListener('dragstart',event => { event.dataTransfer.setData('text/plain',item.id); });
      return element;
    }
    function wireDrop(element,tier) {
      element.addEventListener('dragover',event => { event.preventDefault(); element.closest('.row')?.classList.add('over'); });
      element.addEventListener('dragleave',() => element.closest('.row')?.classList.remove('over'));
      element.addEventListener('drop',event => { event.preventDefault(); move(event.dataTransfer.getData('text/plain'),tier); });
      element.onclick = () => { if (selected) move(selected,tier); };
    }
    function render() {
      const tiers = document.querySelector('#tiers'); tiers.replaceChildren();
      for (const tier of LEVELS.filter(value => value !== 'pool')) {
        const row = document.createElement('div'); row.className = 'row ' + tier;
        const label = document.createElement('button'); label.type = 'button'; label.className = 'label';
        label.textContent = tier; label.setAttribute('aria-label',tier + '등급으로 옮기기');
        label.addEventListener('click',() => { if (selected) move(selected,tier); else showMessage('먼저 영화 카드를 선택해 주세요.'); });

        const drop = document.createElement('div'); drop.className = 'drop'; drop.dataset.tier = tier;
        state.items.forEach((item,index) => { if (item.tier === tier) drop.append(card(item,index)); });
        wireDrop(drop,tier); row.append(label,drop); tiers.append(row);
      }
      const pool = document.querySelector('#pool'); pool.replaceChildren();
      state.items.forEach((item,index) => { if (item.tier === 'pool') pool.append(card(item,index)); });

    }
    wireDrop(document.querySelector('#pool'),'pool');
    document.querySelector('#pool-label').addEventListener('click',() => { if (selected) move(selected,'pool'); else showMessage('먼저 영화 카드를 선택해 주세요.'); });
    document.querySelector('#add-form').addEventListener('submit',event => {
      event.preventDefault(); const input = document.querySelector('#title'); const title = input.value.trim();
      if (!title) { showMessage('영화 제목을 입력해 주세요.'); input.focus(); return; }
      if (state.items.some(item => item.title === title)) { showMessage('이미 있는 영화 제목이에요. 다른 제목을 넣어 주세요.'); return; }
      state.items.push({ id: 'm' + state.nextId++, title, tier: 'pool' });
      save(); render(); input.value = ''; showMessage('영화를 추가했어요.'); input.focus();
    });
    document.querySelector('#reset').addEventListener('click',() => {
      state = initial(); selected = null; editing = null; document.querySelector('#title').value = ''; save(); render(); showMessage('처음 목록으로 돌아왔어요.');
    });
    render();
  </script>
</body>
</html>
